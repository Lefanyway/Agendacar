version: "3.1"

intents:
  - saudacao
  - despedida
  - agradecimento
  - reservar_carro
  - reservar_modelo
  - cancelar_reserva
  - consultar_carros
  - consultar_modelo
  - filtros_carros
  - preco_carros
  - disponibilidade
  - pagamento
  - area_admin
  - recomendacao
  - login_cadastro
  - problema_login
  - minhas_reservas
  - alterar_reserva
  - suporte_humano
  - fora_escopo
  - nlu_fallback

responses:
  utter_saudacao:
    - text: "Olá! Posso ajudar com carros, reservas, pagamento, login e suporte do AgendaCar."

  utter_despedida:
    - text: "Até mais! Quando precisar, estou por aqui."

  utter_agradecimento:
    - text: "De nada! Quando precisar, posso ajudar com carros e reservas."

  utter_reservar_carro:
    - text: "Escolha um carro disponível nos cards abaixo e informe o período da reserva."

  utter_reservar_modelo:
    - text: "Use a busca da tela inicial para encontrar o modelo desejado."

  utter_cancelar_reserva:
    - text: "Para cancelar, acesse Minhas Reservas, selecione a reserva e clique em cancelar."

  utter_consultar_carros:
    - text: "Encontrei os carros disponíveis. Confira os cards abaixo."

  utter_consultar_modelo:
    - text: "Use a busca da tela inicial para encontrar o modelo desejado."

  utter_filtros_carros:
    - text: "Use os filtros da tela inicial para encontrar carros por modelo, categoria, diária ou capacidade."

  utter_preco_carros:
    - text: "A diária aparece no card de cada carro. O valor total é calculado pelo período informado."

  utter_disponibilidade:
    - text: "A disponibilidade aparece no card do carro."

  utter_pagamento:
    - text: "O pagamento é feito na finalização da reserva. Confira as opções disponíveis na tela de pagamento."

  utter_area_admin:
    - text: "A área administrativa é restrita a usuários autorizados."

  utter_recomendacao:
    - text: "Informe passageiros, orçamento e tipo de uso para receber uma recomendação."

  utter_login_cadastro:
    - text: "Para acessar sua conta, use a tela de login ou cadastro."

  utter_problema_login:
    - text: "Verifique seu e-mail e senha. Se o erro continuar, tente redefinir o acesso."

  utter_minhas_reservas:
    - text: "Você pode consultar suas reservas em Minhas Reservas após fazer login."

  utter_alterar_reserva:
    - text: "Para alterar, acesse Minhas Reservas e selecione a reserva desejada."

  utter_suporte_humano:
    - text: "Para suporte, procure o canal de atendimento informado no sistema."

  utter_fora_escopo:
    - text: "Consigo ajudar apenas com carros, reservas, pagamento, login e suporte do AgendaCar."

  utter_fallback:
    - text: "Não entendi com segurança. Pode digitar de outra forma?"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
