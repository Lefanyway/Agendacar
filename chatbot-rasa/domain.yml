version: "3.1"

intents:
  - saudacao
  - despedida
  - agradecimento
  - reservar_carro
  - reservar_modelo
  - cancelar_reserva
  - consultar_carros
  - consultar_modelo
  - filtros_carros
  - preco_carros
  - disponibilidade
  - pagamento
  - area_admin
  - recomendacao
  - login_cadastro
  - problema_login
  - minhas_reservas
  - alterar_reserva
  - suporte_humano
  - fora_escopo
  - nlu_fallback

responses:
  utter_saudacao:
    - text: "Oi! Posso ajudar com carros, reservas, pagamento, login, cancelamento, recomendacoes e area administrativa. Sobre qual assunto voce quer falar?"

  utter_despedida:
    - text: "Ate mais! Quando quiser consultar ou reservar um carro, estou por aqui."

  utter_agradecimento:
    - text: "De nada! Quando quiser comparar carros ou tirar duvida sobre reserva, pode chamar."

  utter_reservar_carro:
    - text: "Para reservar, abra um card de carro, confira diaria, capacidade e disponibilidade, clique no veiculo desejado e informe o periodo. Depois revise os dados e avance para o pagamento."

  utter_reservar_modelo:
    - text: "Para reservar esse modelo, encontre o card dele na tela inicial, confira disponibilidade e diaria, abra os detalhes e informe o periodo da reserva."

  utter_cancelar_reserva:
    - text: "Para cancelar, acesse Minhas Reservas e escolha a reserva desejada. O sistema permite cancelar apenas reservas da conta logada."

  utter_consultar_carros:
    - text: "Na tela inicial, veja os cards dos carros. Cada card mostra modelo, diaria, capacidade, transmissao e disponibilidade. Para reservar, clique no carro desejado e informe o periodo."

  utter_consultar_modelo:
    - text: "Use a busca da tela inicial para procurar o modelo. O card mostra diaria, capacidade, transmissao e disponibilidade antes da reserva."

  utter_filtros_carros:
    - text: "Use busca, tipo, disponibilidade e ordenacao na tela inicial. Assim voce encontra carros por modelo, categoria, diaria ou capacidade."

  utter_preco_carros:
    - text: "A diaria aparece no card de cada carro. O valor total e calculado conforme o periodo informado na reserva."

  utter_disponibilidade:
    - text: "A disponibilidade aparece no card do carro. Se estiver indisponivel, escolha outro modelo ou tente consultar a frota novamente depois."

  utter_pagamento:
    - text: "O pagamento vem depois da escolha do carro e do periodo. Antes de finalizar, confira veiculo, datas, destino e valor total."

  utter_area_admin:
    - text: "A area administrativa permite cadastrar, editar e remover carros da frota. Ela e restrita a usuarios com perfil de administrador."

  utter_recomendacao:
    - text: "Para recomendar melhor, informe passageiros, orcamento por diaria e tipo de uso, como familia, viagem, luxo, esportivo ou economico."

  utter_login_cadastro:
    - text: "Use a tela de login para entrar com email e senha. Se ainda nao tiver conta, faca o cadastro. Reservas e pagamentos exigem usuario autenticado."

  utter_problema_login:
    - text: "Confira email e senha digitados. Se o problema continuar, tente cadastrar novamente ou procure suporte. Por seguranca, nao envie senha pelo chat."

  utter_minhas_reservas:
    - text: "Suas reservas ficam em Minhas Reservas. La voce acompanha carro, periodo, valor e status da reserva feita pela sua conta."

  utter_alterar_reserva:
    - text: "No momento, a forma segura de alterar e cancelar a reserva atual e criar uma nova com o carro, datas e destino corretos."

  utter_suporte_humano:
    - text: "Se precisar de ajuda humana, procure o responsavel pelo sistema ou o suporte informado pela equipe do AgendaCar."

  utter_fora_escopo:
    - text: "Essa pergunta foge do AgendaCar. Posso ajudar apenas com carros, reservas, pagamento, login, cancelamento, recomendacoes e area administrativa."

  utter_fallback:
    - text: "Nao tenho certeza do que voce quis dizer. Pode reformular? Eu ajudo com carros, reservas, pagamento, login, cancelamento, recomendacoes e area admin."

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
